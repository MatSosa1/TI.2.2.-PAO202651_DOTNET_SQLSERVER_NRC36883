# Dirección del servidor REST de APIPaises.
#
# Para apuntar el cliente a otra computadora NO hace falta recompilar: edite este mismo
# archivo junto al .exe (la compilación lo copia a bin/) y vuelva a abrir la aplicación.
# También puede indicar otro archivo con la variable de entorno CLIENTE_CONFIG=C:\ruta\cliente.properties
#
# ws.host + ws.port + ws.context forman la URL base de los servicios:
#   http://localhost:5090/api
ws.host=localhost
ws.port=5090
ws.context=api
